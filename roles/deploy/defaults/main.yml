---
deploy_registry_url: cr.yandex
deploy_registry_username: json_key
deploy_container_name: project-devops-deploy
deploy_container_environment: {}
deploy_managed_environment:
  LOGGING_CONFIG: /app/config/logback-spring.xml
  SPRING_DATASOURCE_URL: "{{ vault_db_url }}"
  SPRING_DATASOURCE_USERNAME: "{{ vault_db_username }}"
  SPRING_DATASOURCE_PASSWORD: "{{ vault_db_password }}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  STORAGE_S3_BUCKET: "{{ deploy_s3_bucket }}"
  STORAGE_S3_REGION: "{{ deploy_s3_region }}"
  STORAGE_S3_ENDPOINT: "{{ deploy_s3_endpoint }}"
  STORAGE_S3_ACCESSKEY: "{{ vault_s3_access_key }}"
  STORAGE_S3_SECRETKEY: "{{ vault_s3_secret_key }}"
deploy_container_published_ports:
  - "127.0.0.1:8080:8080"
  - "127.0.0.1:9090:9090"
deploy_base_dir: /srv/project-devops-deploy
deploy_data_dir: "{{ deploy_base_dir }}/data"
deploy_log_dir: "{{ deploy_base_dir }}/logs"
deploy_config_dir: /etc/project-devops-deploy
deploy_migration_dir: "{{ deploy_config_dir }}/migrations"
deploy_migration_container_name: "{{ deploy_container_name }}-migration"
deploy_migration_image: flyway/flyway:13.4.0-alpine
deploy_container_volumes:
  - "{{ deploy_data_dir }}:/tmp/bulletin-images"
  - "{{ deploy_log_dir }}:/var/log/project-devops-deploy"
  - "{{ deploy_config_dir }}/logback-spring.xml:/app/config/logback-spring.xml:ro"
deploy_container_stop_timeout: 30
deploy_readiness_url: http://127.0.0.1:9090/actuator/health/readiness
deploy_readiness_retries: 40
deploy_readiness_delay: 3
