---
deploy_registry_url: cr.yandex
deploy_registry_username: json_key
deploy_image_repository: cr.yandex/crphrkv4imihhuukiv7q/project-devops-deploy
deploy_image_tag: a100ed36995989034cee26c2cfd9e1558201bdaa
deploy_image: "{{ deploy_image_repository }}:{{ deploy_image_tag }}"
deploy_s3_bucket: uit14-bulletins-images
deploy_s3_region: ru-central1
deploy_s3_endpoint: https://storage.yandexcloud.net

nginx_remove_default_vhost: true
nginx_server_tokens: "off"
nginx_client_max_body_size: 10m
nginx_proxy_cache_path: >-
  /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
  max_size=200m inactive=7d use_temp_path=off
nginx_bootstrap_vhosts:
  - listen: "80 default_server"
    server_name: uit14.ru www.uit14.ru
    filename: project-devops-deploy.conf
    extra_parameters: |
      location ^~ /.well-known/acme-challenge/ {
          root /var/www/letsencrypt;
          default_type text/plain;
      }

      location /assets/ {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_cache static_cache;
          proxy_cache_lock on;
          proxy_cache_valid 200 7d;
          proxy_hide_header Cache-Control;
          proxy_hide_header Expires;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          add_header X-Cache-Status $upstream_cache_status always;
      }

      location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

nginx_https_vhosts:
  - listen: "80 default_server"
    server_name: uit14.ru www.uit14.ru
    filename: project-devops-deploy.conf
    extra_parameters: |
      location ^~ /.well-known/acme-challenge/ {
          root /var/www/letsencrypt;
          default_type text/plain;
      }

      location / {
          return 301 https://$host$request_uri;
      }

  - listen: "443 ssl http2 default_server"
    server_name: uit14.ru www.uit14.ru
    filename: project-devops-deploy-https.conf
    extra_parameters: |
      ssl_certificate /etc/letsencrypt/live/uit14.ru/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/uit14.ru/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
      ssl_prefer_server_ciphers off;
      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:10m;
      ssl_session_tickets off;

      add_header Strict-Transport-Security "max-age=31536000" always;

      location /assets/ {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_cache static_cache;
          proxy_cache_lock on;
          proxy_cache_valid 200 7d;
          proxy_hide_header Cache-Control;
          proxy_hide_header Expires;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          add_header X-Cache-Status $upstream_cache_status always;
      }

      location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

certbot_install_method: package
certbot_create_if_missing: true
certbot_create_method: webroot
certbot_webroot: /var/www/letsencrypt
certbot_auto_renew: true
certbot_auto_renew_user: root
certbot_auto_renew_hour: "3"
certbot_auto_renew_minute: "30"
certbot_auto_renew_options: "--quiet"
certbot_create_command: >-
  {{ certbot_script }} certonly --webroot
  --webroot-path {{ cert_item.webroot | default(certbot_webroot) }}
  --noninteractive --agree-tos --register-unsafely-without-email
  --cert-name {{ cert_item_name }}
  -d {{ cert_item.domains | join(',') }}
certbot_certs:
  - name: uit14.ru
    webroot: /var/www/letsencrypt
    domains:
      - uit14.ru
      - www.uit14.ru
